{%- assign post = include.post -%}
<a class="recipe-row" href="{{ post.url | relative_url }}" {% include data-attrs.html post=post %}>
  <span class="recipe-num mono">{{ include.index | prepend: "0" | slice: -2, 2 }}</span>
  <span class="recipe-name">{{ post.title }}</span>
  <span class="recipe-meta mono">{{ post.cuisine }}{% if post.cuisine and post.time_minutes %} · {% endif %}{% if post.time_minutes %}{{ post.time_minutes }} min{% endif %}</span>
</a>
