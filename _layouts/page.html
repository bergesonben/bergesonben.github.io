---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {%- if page.image %}
    <img class="page-portrait" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: site.author.name | escape }}">
    {%- endif %}
    {{ content }}
  </div>
</article>
